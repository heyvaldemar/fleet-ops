name: Rollout Daily Freshness Cron

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report only, push nothing"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  rollout:
    name: Switch every pin-bearing template to the daily cron
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the rollout
        env:
          GH_TOKEN: ${{ secrets.FLEET_PAT }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          chmod +x scripts/rollout-daily-cron.sh
          ./scripts/rollout-daily-cron.sh
