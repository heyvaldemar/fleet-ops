name: Secret Scan

# GitHub's own secret scanning is free on public repositories and is enabled on
# every public repository in this account. It is not available on a private
# repository owned by a personal account without an enterprise plan, and these
# repositories are private — which is exactly where a server configuration or a
# deployment key would sit.
#
# So the same job is done here by gitleaks, pinned by digest, over the FULL
# history rather than the working tree: a credential removed from the tip is
# still readable in the commit that added it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a rule added upstream reaches an untouched repository too.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Scan the full history for committed credentials
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository with its whole history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The default shallow clone would scan one commit. A secret is
          # almost never in the commit you are looking at.
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks
        # THE WHOLE HISTORY ON A SCHEDULE; WHAT JUST ARRIVED ON A PUSH.
        #
        # This repository is a mirror that pushes every hour, and every push
        # re-scanned the entire history from the beginning: the same commits,
        # twenty-four times a day, for a credential that could only be in the
        # handful that just landed. It was the second largest consumer of the
        # account's Actions minutes, behind fleet triage and ahead of every
        # real piece of work.
        #
        # A secret is almost never in the commit you are looking at, which is
        # why the push scan takes a RANGE rather than a commit: everything
        # between what was there before and what is there now. The weekly cron
        # still reads the whole history, so a rule added upstream reaches the
        # commits nobody has touched since, and a force-push that rewrote
        # history is caught within the week.
        #
        # --redact so a finding names the file and the rule and never puts the
        # value itself into a log that is kept for ninety days.
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          scan=(detect --source=/repo --redact --no-banner --verbose)
          if [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] \
             && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "scanning what arrived in this push: $BEFORE..$GITHUB_SHA"
            scan+=(--log-opts="$BEFORE..$GITHUB_SHA")
          else
            echo "scanning the whole history"
          fi
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            "${scan[@]}"
