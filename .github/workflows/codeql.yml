name: CodeQL

# Static analysis of the Python under scripts/ and of the workflows themselves,
# with results in the Security tab.
#
# verify.yml already reads every script on every push - pyflakes, ShellCheck,
# actionlint - and that is what catches a broken script before a cron does.
# None of the three is a tool OpenSSF Scorecard's SAST check recognises, so
# the repository scored 0 there with three linters running. CodeQL is one it
# does, and it asks a different question of the code: taint and data flow
# rather than names and syntax.
#
# Languages are not listed: CodeQL reads what the checkout contains. Nothing
# here is compiled, so there is no build step and nothing to install.
on:
  push:
    branches: [main]
  schedule:
    # Weekly, the day after the Scorecard run, so a query added upstream
    # reaches an untouched repository too.
    - cron: "0 7 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # To upload the SARIF to the Security tab.
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialise CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

      - name: Analyse
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
