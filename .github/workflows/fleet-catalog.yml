name: Fleet catalog

# Three live blocks: the full table in heyvaldemar/catalog, and in the
# profile README the three-line summary and the evidence line (restore scripts
# shipped and run, releases tagged). The same numbers, and the latest measured
# clean-machine restores, go to catalog/fleet.json, which the pages on
# heyvaldemar.com read. Either repository is touched only when a row or a
# count changed; the timestamp alone never makes a commit.
on:
  schedule:
    # The job rewrites only when a row or a count actually changed, so a run
    # that finds nothing costs a handful of API calls and produces no commit.
    # It ran every four hours once, then twice a day; the page now reads its
    # cadence off this line rather than stating one, because it went on saying
    # "every four hours" through both of those changes.
    # Once a day now, not twice and not six times. This feeds the counts on a
    # profile README and the catalog page, and those move when a release is
    # cut — which is a thing that happens on some days and not others, so a
    # second pass buys a fresher number only for whoever looks in the window
    # between them. On a private repository each run is billed: measured
    # 2026-09-22, the fleet was projected at about 4400 minutes a month
    # against an allowance of 3000.
    - cron: "20 6 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/fleet-catalog.py"
      - ".github/workflows/fleet-catalog.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fleet-catalog
  cancel-in-progress: false

jobs:
  catalog:
    name: Regenerate the catalog and the profile summary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GIT_AUTHOR_NAME: Vladimir Mikhalev
      GIT_AUTHOR_EMAIL: 10498744+heyvaldemar@users.noreply.github.com
      GIT_COMMITTER_NAME: Vladimir Mikhalev
      GIT_COMMITTER_EMAIL: 10498744+heyvaldemar@users.noreply.github.com
    steps:
      - name: Checkout fleet-ops
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout the catalog repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: heyvaldemar/catalog
          token: ${{ secrets.FLEET_PAT }}
          path: catalog

      - name: Checkout the profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: heyvaldemar/heyvaldemar
          token: ${{ secrets.FLEET_PAT }}
          path: profile

      - name: Rewrite both blocks
        id: gen
        env:
          GH_TOKEN: ${{ secrets.FLEET_PAT }}
        run: |
          python3 scripts/fleet-catalog.py --catalog catalog/README.md --summary profile/README.md --evidence profile/README.md --json catalog/fleet.json | tee /tmp/gen.txt
          grep -q "^catalog: updated" /tmp/gen.txt && echo "catalog=updated" >> "$GITHUB_OUTPUT" || true
          grep -q "^summary: updated" /tmp/gen.txt && echo "summary=updated" >> "$GITHUB_OUTPUT" || true
          grep -q "^evidence: updated" /tmp/gen.txt && echo "evidence=updated" >> "$GITHUB_OUTPUT" || true
          grep -q "^json: updated" /tmp/gen.txt && echo "json=updated" >> "$GITHUB_OUTPUT" || true

      - name: Push the catalog when a row changed
        # Under FLEET_REHEARSAL the blocks are regenerated and compared, and nothing is pushed.
        if: vars.FLEET_REHEARSAL != 'true' && (steps.gen.outputs.catalog == 'updated' || steps.gen.outputs.json == 'updated')
        run: |
          cd catalog
          git add README.md fleet.json
          git commit -q -m "The catalog, regenerated" -m "A release or a workflow changed in one of the repositories; this table follows. Generated by fleet-ops from the release and workflow data GitHub holds."
          # A push that landed on main while the blocks were being rewritten
          # (2026-09-25: a README edit by hand, minutes before) is not a reason
          # to lose the morning's counts; the regenerated commit goes on top.
          git pull -q --rebase origin main
          git push -q origin HEAD:main
          echo "catalog updated"

      - name: Push the profile when a count changed
        if: vars.FLEET_REHEARSAL != 'true' && (steps.gen.outputs.summary == 'updated' || steps.gen.outputs.evidence == 'updated')
        run: |
          cd profile
          git add README.md
          git commit -q -m "docs: the fleet counts, regenerated" -m "Generated by fleet-ops from the same data as the catalog."
          # A push that landed on main while the blocks were being rewritten
          # (2026-09-25: a README edit by hand, minutes before) is not a reason
          # to lose the morning's counts; the regenerated commit goes on top.
          git pull -q --rebase origin main
          git push -q origin HEAD:main
          echo "profile updated"
