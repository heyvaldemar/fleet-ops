name: Fleet Conformance

# Asks, every morning, whether every template still meets the fleet standard.
#
# It exists because one did not and nobody noticed for two months: the wave
# that added container hardening skipped a repository, and because that
# repository had the pins and the CI the standard also asks for, it looked
# finished from the outside. A wave applied is not a wave verified.

on:
  schedule:
    # Before the evening Fleet Triage, so its report is read first. Exact
    # spacing is fiction on this account — every cron here lands two to eight
    # hours after the minute it names, measured over September — but the
    # ordering holds on most days.
    - cron: '0 12 * * *'
    # THE SECOND PASS IS GONE, AND WHAT IT COVERED IS NOT. It was insurance
    # against GitHub dropping a scheduled run outright, which it does: on
    # 2026-09-08 the 06:45 triage ran at 11:43 and the 13:00 one never ran.
    # The heartbeat now asks that question directly for every scheduled
    # workflow in the fleet — it reports a schedule that has not fired within
    # its own interval — so a dropped run here is reported rather than
    # silently replaced. Removed 2026-09-22, with the triage and catalog
    # passes, when this private repository was measured at about 3300 billed
    # minutes a month.
  push:
    branches: [main]
    paths:
      - 'scripts/fleet-conformance.py'
      - 'tests/test-conformance.sh'
      - 'tests/test-conformance-kubernetes.sh'
      - 'tests/test-conformance-sandbox.sh'
      - 'tests/test-fleet-kind.sh'
      - 'scripts/fleet_kind.py'
      - '.github/workflows/fleet-conformance.yml'
  workflow_dispatch:

permissions:
  # Read-only for the whole file; the job below names what it writes.
  contents: read

jobs:
  conformance:
    permissions:
      contents: read
      # To start Fleet Triage when the scheduler dropped it.
      actions: write
    name: Every template against the standard
    # THE HOUSE COPY DOES NOT ACT. The fleet runs from the public copy of
    # this repository; the private one keeps the two jobs about the home
    # servers and sets the repository variable FLEET_ROLE=house, under which
    # this job is skipped rather than run twice from two places.
    if: vars.FLEET_ROLE != 'house'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the reference repositories
        # Only git and gh run in this step; the read token never reaches a
        # script from this repository. The Kubernetes rules are broken on a
        # copy of the Kubernetes platform, the helm_release rule on a
        # Terraform pipeline that installs a chart. The platform is private
        # until its first release: anonymous first, then the read token,
        # which has to be granted that repository until it is public.
        env:
          READ_TOKEN: ${{ secrets.FLEET_READ_PAT }}
          OWNER: ${{ github.repository_owner }}
        run: |
          git clone -q --depth 1 "https://github.com/$OWNER/nextcloud-traefik-letsencrypt-docker-compose" /tmp/reference
          git -C /tmp/reference fetch -q --depth 1 origin --tags
          git clone -q --depth 1 "https://github.com/$OWNER/amazon-eks-cluster-pipeline-terraform" /tmp/tf-reference
          git -C /tmp/tf-reference fetch -q --depth 1 origin --tags
          git clone -q --depth 1 "https://github.com/$OWNER/kubernetes-ai-agent-sandbox" /tmp/sandbox-reference
          git -C /tmp/sandbox-reference fetch -q --depth 1 origin --tags
          if ! GIT_TERMINAL_PROMPT=0 git clone -q --depth 1 "https://github.com/$OWNER/aws-eks-reference-platform" /tmp/k8s-reference 2>/dev/null; then
            if [ -z "$READ_TOKEN" ] || ! GH_TOKEN="$READ_TOKEN" gh repo clone "$OWNER/aws-eks-reference-platform" /tmp/k8s-reference -- -q --depth 1; then
              echo "aws-eks-reference-platform is private and the read token cannot see it" > /tmp/k8s-reference.unavailable
              echo "::warning::the Kubernetes conformance rules were not exercised: $(cat /tmp/k8s-reference.unavailable)"
            fi
          fi

      - name: Prove the rules can still fail
        # A check that has never failed is not known to work. The suite breaks
        # a conforming repository one rule at a time and fails if the rule
        # stays quiet, so a rule that rots into a no-op is caught here rather
        # than by a green report that checked nothing.
        run: |
          chmod +x tests/test-conformance.sh tests/test-conformance-kubernetes.sh tests/test-conformance-sandbox.sh tests/test-fleet-kind.sh
          ./tests/test-conformance.sh /tmp/reference
          if [ -e /tmp/k8s-reference.unavailable ]; then
            echo "SKIPPED tests/test-conformance-kubernetes.sh: $(cat /tmp/k8s-reference.unavailable)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            ./tests/test-conformance-kubernetes.sh /tmp/k8s-reference /tmp/tf-reference
          fi
          ./tests/test-conformance-sandbox.sh /tmp/sandbox-reference
          ./tests/test-fleet-kind.sh

      - name: Check the fleet
        # pipefail on this step and the next: both scripts exit 1 when a
        # repository falls short or a claim stops being true, and through tee
        # the exit was tee's. On 2026-10-15 a README that named the wrong
        # Outline version and a claims check that could not read the profile
        # both ran green.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          python3 scripts/fleet-conformance.py | tee "$GITHUB_STEP_SUMMARY"

      - name: The profile's hand-written claims are still true
        # The counts on the profile are generated by the catalog job and cannot
        # drift. The table above them is hand-written and names two
        # repositories and the supply-chain surface each is supposed to show —
        # the strongest and most checkable claims on that page, and until now
        # nothing re-read them. A workflow that lost its cosign step would
        # leave the profile advertising it to the audience most likely to look.
        env:
          GH_TOKEN: ${{ secrets.FLEET_PAT }}
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          python3 scripts/profile-claims.py --json profile-claims.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Start Fleet Triage if the scheduler dropped it
        # A cron that did not fire says nothing. This asks: did a triage run
        # start in the last eight hours? If not, start one. Triage carries its
        # own concurrency group, so a late-firing schedule and this cannot
        # overlap; the worse of the two outcomes is one extra quiet run.
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          last="$(gh run list --repo "$REPO" --workflow fleet-triage.yml --limit 1 --json createdAt --jq '.[0].createdAt // ""')"
          now="$(date -u +%s)"
          then="$( [ -n "$last" ] && date -u -d "$last" +%s || echo 0 )"
          age=$(( (now - then) / 3600 ))
          if [ "$age" -ge 8 ]; then
            echo "last triage run started ${age}h ago (or never): starting one"
            gh workflow run fleet-triage.yml --repo "$REPO"
          else
            echo "last triage run started ${age}h ago: nothing to do"
          fi
