name: Token check
# What the fleet's tokens can do, read without doing anything.
#
# A rehearsal copy reads everything and pushes nothing, so the one thing it
# never proves is that FLEET_PAT can push. This asks GitHub what each token
# is allowed to do on a template, on the catalogue and on the profile, and
# on this repository, and fails if any needed permission is missing. Run by
# hand before a copy of this repository is made the executor, and any time
# a token is replaced.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: What FLEET_PAT and FLEET_READ_PAT may do
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: FLEET_PAT must push to the fleet, the catalogue and the profile, and write issues here
        env:
          GH_TOKEN: ${{ secrets.FLEET_PAT }}
          REPO: ${{ github.repository }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::error::FLEET_PAT is not set"; exit 1; }
          bad=0
          for r in heyvaldemar/keycloak-traefik-letsencrypt-docker-compose heyvaldemar/catalog heyvaldemar/heyvaldemar "$REPO"; do
            p="$(gh api "repos/$r" --jq '.permissions | "push=\(.push) admin=\(.admin)"' 2>/dev/null || echo "unreadable")"
            echo "  $r: $p"
            case "$p" in *push=true*) ;; *) echo "::error::FLEET_PAT cannot push to $r"; bad=1 ;; esac
          done
          # Issues and pull requests: asked as scopes, not by writing one.
          scopes="$(gh api -i user 2>/dev/null | grep -i '^x-oauth-scopes:' || true)"
          echo "  classic scopes (empty for a fine-grained token): ${scopes#*: }"
          n="$(gh api 'users/heyvaldemar/repos?per_page=100&type=owner' --paginate --jq 'length' 2>/dev/null | paste -sd+ - | bc)"
          echo "  repositories readable: ${n:-0}"
          [ "${n:-0}" -ge 90 ] || { echo "::error::FLEET_PAT reads ${n:-0} repositories; the fleet has more than ninety"; bad=1; }
          exit "$bad"

      - name: FLEET_READ_PAT must read the fleet's workflow runs and nothing need be written
        env:
          GH_TOKEN: ${{ secrets.FLEET_READ_PAT }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::error::FLEET_READ_PAT is not set"; exit 1; }
          runs="$(gh api 'repos/heyvaldemar/keycloak-traefik-letsencrypt-docker-compose/actions/runs?per_page=1' --jq '.total_count' 2>/dev/null || echo unreadable)"
          echo "  workflow runs readable on a template: $runs"
          case "$runs" in ''|unreadable) echo "::error::FLEET_READ_PAT cannot read workflow runs"; exit 1 ;; esac
